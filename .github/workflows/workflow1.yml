name: workflow1
on:
  push:
    branches:
      - feature/*
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: test unitarios
        run: |
          ./gradlew unitary
      - name: test integracion
        run: |
          ./gradlew integration
