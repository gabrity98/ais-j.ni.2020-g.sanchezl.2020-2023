on:
  schedule: 
    - cron: '0 0 * * *'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: 
          ref: develop
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: test unitario 1
        run: mvn test -Dtest=ReviewServiceUnitaryTest
      - name: test unitario 2
        run: mvn test -Dtest=testBookService
      - name: test integracion 1
        run: mvn test -Dtest=OpenLibraryServiceIntegrationTest
      - name: test integracion 2
        run: mvn test -Dtest=testOpenLibraryService
      - name: test ApiRest
        run: mvn test -Dtest=RestTest
      - name: test selenium
        run: mvn test -Dtest=testSelenium
      - name: Generate tag
        run: echo "tag=$(date +'%Y%m%d.%H%M%S')" >> $GITHUB_OUTPUT
        id: timestamp
      - name: Generate Docker image
        run: mvn spring-boot:build-image -DskipTests -Dspring-boot.build-image.imageName=${{ secrets.DOCKERHUB_USERNAME }}/books-reviewer:dev-${{ steps.timestamp.outputs.tag }}
      - name: Login to DockerHub
        run: docker login
         -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
      - name: Push image to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/books-reviewer:dev-${{ steps.timestamp.outputs.tag }}
